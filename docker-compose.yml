# Postgres (5432) and MinIO (9000/9001) are expected to be already running locally.
# This only adds a mail catcher so OTP emails can be read at http://localhost:8025
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: forever-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped
